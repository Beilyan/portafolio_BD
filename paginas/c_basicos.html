<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C++ - Programas Básicos</title>

	<!-- Tailwind -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Tu CSS -->
	<link rel="stylesheet" href="../css/style.css"> <!-- Ajusta la ruta -->

	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			background: #f5f5f5;
		}

		h1 {
			margin-bottom: 20px;
		}

		.pdf-container {
			width: 100%;
			height: calc(100vh - 120px);
			/* Restamos el alto del menú fijo */
			border: 2px solid #ccc;
		}

		main {
			padding: 1rem;
			padding-top: 140px;
			/* deja espacio para menú fijo */
		}
	</style>
</head>

<body>

	<!-- Menú -->
	<div id="menu"></div>
	<script>
		fetch("../includes/menu.html")  // Ajusta la ruta
			.then(res => res.text())
			.then(html => {
				document.getElementById("menu").innerHTML = html;
			});
	</script>

	<!-- Contenido principal -->
	<main>
		<h1 class="titulos">C++ - Programas Básicos</h1>
		<div class="pdf-container">
			<embed src="pdf/c_basicos.pdf" type="application/pdf" width="100%" height="100%">
		</div>
	</main>

</body>

</html>
